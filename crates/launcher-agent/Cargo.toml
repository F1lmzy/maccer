[package]
name = "launcher-agent"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
async-channel.workspace = true
base64 = "0.22"
launcher-core = { path = "../launcher-core" }
launcher-client = { path = "../launcher-client" }
launcher-protocol = { path = "../launcher-protocol" }
launcher-config = { path = "../launcher-config" }
launcher-macos = { path = "../launcher-macos" }
provider-apps = { path = "../provider-apps" }
provider-calculator = { path = "../provider-calculator" }
provider-web = { path = "../provider-web" }
provider-files = { path = "../provider-files" }
provider-shell = { path = "../provider-shell" }
provider-clipboard = { path = "../provider-clipboard" }
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
tracing.workspace = true
global-hotkey.workspace = true
dirs = "6"

[dev-dependencies]
launcher-service = { path = "../launcher-service" }
tempfile = "3"
