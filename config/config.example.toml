[launcher]
hotkey = "alt-space"
width = 480
# Keep up to 50 results; the window shows six rows at a time.
max_results = 50

# Shared-service only. Unset by default, so the backend has no global shortcut
# until a frontend is selected. Restart the backend after changing this.
# [service.frontend]
# kind = "gpui"
# path = "~/Documents/maccer/target/debug/maccer"
# For Pill, use kind = "pill" and the application bundle directory:
# path = "~/pill-macos-spike/build/app/PillSpike.app"

[providers.apps]
enabled = true
prefix = "/apps"
priority = 100
default_search = true
max_results = 10

[providers.calculator]
enabled = true
prefix = "="
priority = 90
default_search = false
max_results = 1

# Application catalog discovery. The system roots (/Applications,
# /System/Applications, /System/Library/CoreServices/Applications, ~/Applications
# and Finder) are always scanned. Extra roots listed here are scanned first, so
# a bundle found there wins bundle-identifier and path conflicts.
[apps]
paths = []
# Example: paths = ["/opt/apps", "~/Applications/Setapp"]
# Rescan after debounced filesystem changes. Set false for a one-time startup scan.
watch = true

[providers.files]
enabled = true
prefix = "/"
priority = 80
default_search = false
max_results = 50

# Requires fd: brew install fd. Files and folders are indexed in the background.
# fd respects .gitignore/.ignore/.fdignore and skips hidden entries by default.
# roots is accepted as an alias for search_dirs. No built-in folder boosts apply.
[files]
search_dirs = ["~"]
exclude_paths = []
# Regular expressions, matching full absolute paths, as in Elephant Files.
ignored_dirs = []
# Example: ignored_dirs = ["/Library/(Caches|Logs)/", "/Documents/Private/"]
# Disable previews for sensitive directories without hiding their search results.
ignore_previews = []
# Live updates after debounced filesystem changes. Unlike Elephant's default,
# maccer enables watching. Set false and use the Refresh File Index action instead.
watch = true

[providers.shell]
enabled = true
prefix = ">"
priority = 70
# Shell never participates in mixed search, even if this is set to true.
default_search = false
max_results = 10

# Commands run only after an explicit selection and confirmation. Execution uses
# /bin/sh in your home directory, with a 30s deadline and 64 KiB per output stream.
[[shell.commands]]
name = "Show working directory"
keywords = ["cwd", "pwd"]
command = "pwd"

[providers.clipboard]
enabled = true
prefix = ":"
priority = 60
# Clipboard contents never participate in ordinary app search.
# Shared-service mode captures in the backend even with no frontend running.
# Copy and history management work there; direct Paste is embedded-only.
default_search = false
max_results = 50

[clipboard]
# Text-only, in-memory history. Pinned entries count toward this limit.
max_entries = 200

# Shared-service only. Browsing/preview never applies a theme. Live Apply
# requires explicit confirmation and also sets the theme's first wallpaper;
# disable this provider to avoid starting either catalog or mutation helpers.
[providers.themes]
enabled = true
prefix = "/themes"
priority = 50
default_search = true
max_results = 50

# Shared-service only. A browsable wallpaper picker: `/walls` opens a filmstrip
# of the active theme's wallpapers, and Enter sets one without changing the
# theme. Never part of mixed search.
[providers.wallpapers]
enabled = true
prefix = "/walls"
priority = 40
default_search = false
max_results = 50

[providers.web]
enabled = true
prefix = "?"
priority = -100
default_search = true
max_results = 2

[web]
default_engine = "google"

# Web results open in a native panel inside the launcher. Set
# inline_preview = false to always hand them to the default browser.
#
# prewarm starts WebKit as soon as a web result is selected, which removes
# process start-up from the moment you press Enter. It costs its resident
# memory only while such a result is selected.
#
# idle_release_seconds is how long a hidden page is kept for an instant
# re-open before its document is released. 0 keeps it until maccer exits.
inline_preview = true
prewarm = true
idle_release_seconds = 300

# Omit the [[web.engines]] tables to keep the built-in Google and DuckDuckGo
# engines. Defining any engine replaces the whole built-in list, and
# default_engine must match one of the configured engine ids.
#
# [[web.engines]]
# id = "google"
# name = "Google"
# url = "https://www.google.com/search?q={query}"
#
# [[web.engines]]
# id = "duckduckgo"
# name = "DuckDuckGo"
# url = "https://duckduckgo.com/?q={query}"
#
# [[web.engines]]
# id = "docs"
# name = "Rust Docs"
# url = "https://doc.rust-lang.org/std/?search={query}"
