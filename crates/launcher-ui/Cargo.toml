[package]
name = "launcher-ui"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
gpui.workspace = true
launcher-core = { path = "../launcher-core" }
launcher-agent = { path = "../launcher-agent" }
launcher-protocol = { path = "../launcher-protocol" }
launcher-macos = { path = "../launcher-macos" }
anyhow.workspace = true
tracing.workspace = true
async-channel.workspace = true
serde_json.workspace = true
unicode-segmentation = "1"
image = { version = "0.25.1", default-features = false, features = ["png"] }

[dev-dependencies]
tracing-subscriber.workspace = true
launcher-service = { path = "../launcher-service" }
provider-apps = { path = "../provider-apps" }
provider-web = { path = "../provider-web" }
provider-clipboard = { path = "../provider-clipboard" }
tempfile = "3"
gpui = { workspace = true, features = ["test-support"] }
