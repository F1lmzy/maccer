[package]
name = "launcher-macos"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
async-channel.workspace = true
launcher-core = { path = "../launcher-core" }
libc = "0.2"
notify = "8"
regex = "1"
unicode-normalization = "0.1"
rusqlite.workspace = true
tempfile = "3"
url = "2"
plist = "1"
global-hotkey = "0.8"
objc2 = { version = "=0.6.4", features = ["exception"] }
objc2-app-kit = { version = "=0.3.2", features = ["NSWorkspace", "NSPasteboard", "NSScreen", "NSEvent", "NSRunningApplication", "NSApplication"] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSDictionary", "NSError", "NSAutoreleasePool", "NSProcessInfo", "NSString", "NSURL"] }

[[test]]
name = "resident_menu"
harness = false

[[test]]
name = "service_hotkey"
harness = false

[dev-dependencies]
tracing-subscriber.workspace = true
gpui.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
objc2-service-management = { version = "=0.3.2", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }
block2 = "0.6"
dispatch2 = "=0.3.1"
